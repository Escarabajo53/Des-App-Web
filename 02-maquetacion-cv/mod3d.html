<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modelado 3D</title>
    <link rel="icon" type="image/png" href="img/TenguLogo.png">

    <style>
    @font-face {
        font-family: "Texto"; 
        src: url("fonts/komika_display/KMKDSP__.ttf") format("truetype");
    }
    @font-face {
        font-family: "Titulos";
        src: url("fonts/avengeance_mightiest_avenger/AVENGEANCE MIGHTIEST AVENGER.ttf") format("truetype");
    }

    body {
        font-family: "Texto", Arial, sans-serif;
        margin: 0; 
        background: #0D0D0D;
    }

    h1 {
        font-family: "Titulos", Arial, sans-serif;
        font-size: 50px;
        margin: 0;
        color: white;
    }

    .contenedor {
        display: grid;
        grid-template-columns: 15% 70% 15%;
        min-height: 100vh;
    }

    .col-1, .col-3 {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: hidden;
    }

    .video-fondo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    }

    .col-2 { 
        background: #0D0D0D; 
        padding: 40px;
        min-height: 100vh;
    }

    .cabecera-seccion {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 50px;
        position: relative;
    }

    .btn-volver {
        width: 50px;
        height: 50px;
        border: 2px solid #FF0020;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-decoration: none;
        font-size: 22px;
        font-weight: bold;
        background-color: transparent;
        transition: all 0.4s ease;
    }

    .btn-volver:hover {
        transform: scale(1.15);
        background-color: #FF0020;
        color: white;
        border-color: #FF0020;
        box-shadow: 0 0 20px rgba(255, 0, 32, 0.6);
    }
    .logo-esquina {
        position: absolute;
        right: 0;
        width: 80px;
    }

    .grid-imagenes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
    }

    .item {
        background: transparent;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s ease;
    }


    .item img,
    .item video {
        width: 100%;
        height: auto;
        display: block;
    }

    .item-video {
        width: 100%;
        height: auto;
        object-fit: contain;     /* muestra el video completo */
        /* Si quieres que llene más el espacio usa: object-fit: cover; */
    }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="col-1">
            <video autoplay muted loop class="video-fondo">
                <source src="vid/G girando.mp4" type="video/mp4">
            </video>
        </div>

        <div class="col-2">
            <header class="cabecera-seccion">
                <a href="portafolio.html" class="btn-volver">&lt;</a>
                <h1>MODELADO 3D</h1>
                <img src="img/TenguLogo.png" class="logo-esquina">
            </header>

            <div class="grid-imagenes">
                <div class="item">
                    <video autoplay muted loop playsinline class="item-video">
                        <source src="vid/mod3d/vid mod3d.mp4" type="video/mp4">
                        Tu navegador no soporta el video.
                    </video>
                </div>
                <div class="item"><img src="img/mod3d/mod3d (1).png"></div>
                <div class="item"><img src="img/mod3d/mod3d (2).png"></div>
                <div class="item"><img src="img/mod3d/mod3d (3).png"></div>
            </div>
        </div>

        <div class="col-3">
            <video autoplay muted loop class="video-fondo">
                <source src="vid/G girando.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</body>
</html>
