<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modelado 3D</title>
    <link rel="icon" type="image/png" href="img/TenguLogo.png">

    <style>
    @font-face {
        font-family: "Texto"; 
        src: url("fonts/komika_display/KMKDSP__.ttf") format("truetype");
    }
    @font-face {
        font-family: "Titulos";
        src: url("fonts/avengeance_mightiest_avenger/AVENGEANCE MIGHTIEST AVENGER.ttf") format("truetype");
    }

    body {
        font-family: "Texto", Arial, sans-serif;
        margin: 0; 
        background: #0D0D0D;
    }

    h1 {
        font-family: "Titulos", Arial, sans-serif;
        font-size: 50px;
        margin: 0;
        color: white;
    }

    .contenedor {
        display: grid;
        grid-template-columns: 15% 70% 15%;
        height: 100vh; 
    }

    .col-1, .col-3 { background: #1F222D; }
    
    .col-2 { 
        background: #0D0D0D; 
        padding: 40px;
        overflow-y: auto;
    }

    /* Cabecera */
    .cabecera-seccion {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 50px;
        position: relative;
    }

    .btn-volver {
        width: 50px;
        height: 50px;
        border: 2px solid #FF0020;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-decoration: none;
        font-size: 20px;
        font-weight: bold;
    }

    .logo-esquina {
        position: absolute;
        right: 0;
        width: 80px;
    }

    /* Galería */
    .grid-imagenes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .item {
        background: #1F222D;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #333;
    }

    .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="col-1"></div>

        <div class="col-2">
            <header class="cabecera-seccion">
                <a href="portafolio.html" class="btn-volver">&lt;</a>
                <h1>MODELADO 3D</h1>
                <img src="img/TenguLogo.png" class="logo-esquina">
            </header>

            <div class="grid-imagenes">
                <div class="item"><img src="img/mod3d/mod3d (1).png"></div>
                <!-- Agrega más aquí abajo -->
                <div class="item"><img src="img/mod3d/mod3d (2).png"></div>
            </div>
        </div>

        <div class="col-3"></div>
    </div>
</body>
</html>
