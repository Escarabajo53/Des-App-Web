<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portafolio</title>
    <link rel="icon" type="image/png" href="img/TenguLogo.png">


    <style>
    @font-face {
        font-family: "Texto"; 
        src: url("fonts/komika_display/KMKDSP__.ttf") format("truetype");
    }
    @font-face {
        font-family: "Titulos";
        src: url("fonts/avengeance_mightiest_avenger/AVENGEANCE MIGHTIEST AVENGER.ttf") format("truetype");
    }

    body {
        font-family: "Texto", Arial, sans-serif;
        margin: 0; 
    }
    h1, h2, h3, h4, h5, h6 {
        font-family: "Titulos", Arial, sans-serif;
    }
    h1 {
        font-size: 50px;
    }
    h2 {
        font-size: 18px;
    }

    .contenedor {
        display: grid;
        grid-template-columns: 15% 70% 15%;
        gap: 0;
        height: 100vh; 
    }

    .col-1 {
    position: relative;
    overflow: hidden;
    }

    .video-fondo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 100%;
        height: 100%;
        object-fit: cover;

        z-index: 0;
    }
    .col-2 { background: #0D0D0D; }
    .col-3 {
    position: relative;
    overflow: hidden;
    }

    .video-fondo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center calc(50% - 10px);
        z-index: 0;
    }

    .col-1, .col-2, .col-3 {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    img {
        display: block;
        margin: auto;
        margin-bottom: 10px;
    }

    img:last-of-type {
        margin-top: 18px;
    }

    section {
        margin-top: 30px;
    }

    .columnas {
        display: flex;
        gap: 20px;
    }

    .col-2 {
    padding: 25px; 
    }
    
    .col-2{
        padding: 20px 20px;
    }

    .columna {
        width: 50%;
    }

    h1, p {
        margin-bottom: 18px;
        display: block;
    }

    a, p {
        margin-bottom: 30px;
        display: block;
    }

    a {
        font-size: 18px;
        color: white;
        background-color: #0D0D0D;
        padding: 18px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 6px 30px;
        border: 2px solid #FF0020;
    }

    a:hover {
        transform: scale(1.08);
        background-color: #FF0020;
        color: white;
        border-color: #FF0020;
        box-shadow: 0 0 25px rgba(255, 0, 32, 0.5);
    }

    .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        text-align: center;
    }

    .grupo-arriba {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }



    .btn-volver {
        width: 50px;
        height: 50px;
        border: 2px solid #FF0020;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-decoration: none;
        font-size: 22px;
        font-weight: bold;
        background-color: transparent;
        transition: all 0.4s ease;
    }



    .btn-volver:hover {
        transform: scale(1.20);
        background-color: #FF0020;
        color: white;
        border-color: #FF0020;
        box-shadow: 0 0 25px rgba(255, 0, 32, 0.6);
    }

    img {
        margin-bottom: 15px;
    }

    </style>
</head>

<body>

    <div class="contenedor">
        <div class="col-1">
            <video autoplay muted loop class="video-fondo">
                <source src="vid/G girando.mp4" type="video/mp4">
            </video>
        </div>

        <div class="col-2">
            <div class="menu">
                <img src="img/TenguLogo.png" width="220px">
                <h1>PORTAFOLIO</h1>
                <div class="grupo-arriba">
                    <a href="ilus.html">I l u s t r a c i o n</a>
                    <a href="mod3d.html">M o d e l a d o 3 D</a>
                    <a href="foto.html">F o t o g r a f i a</a>
                </div>
                <a href="index.html">I n i c i o</a>
            </div>
        </div>

        <div class="col-3">
            <video autoplay muted loop class="video-fondo">
                <source src="vid/G girando.mp4" type="video/mp4">
            </video>           
        </div>
        
    </div>     

</body>
</html>
