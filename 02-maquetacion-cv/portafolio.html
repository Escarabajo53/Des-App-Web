    }

    .col-2 {

    }

    a, p {
        margin-bottom: 30px;
        display: block;
    }

    a {
        font-size: 18px;
        color: white;
        background-color: #0D0D0D;
        
        padding: 18px 18px;
        border-radius: 10px;

        text-decoration: none;

        display: flex;
        justify-content: center;

        margin: 6px 30px;
